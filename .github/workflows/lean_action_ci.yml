name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Check documentation references resolve
        run: python scripts/check-doc-references.py
      - name: Require centralized Lean options
        run: python scripts/check-lean-options.py
      - name: Check paper claim registry
        run: python scripts/check-paper-claims.py --allow-missing-paper
      - name: Test paper claim checker
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - uses: leanprover/lean-action@v1
      - name: Require a warning-free Lean build
        run: lake --wfail build
      - uses: leanprover-community/docgen-action@v1
