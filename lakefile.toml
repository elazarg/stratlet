name = "VegasCore"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Interaction", "InteractionTests", "Vegas", "VegasEVM", "VegasTests", "Paper"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3
warningAsError = true
# Guarded #print axioms commands are intentional regression tests in this project.
weak.linter.hashCommand = false
# Game carriers use ordinary definitions; implicit type matching must unfold them.
# This affects elaboration only, not kernel checking or the accepted axioms.
backward.isDefEq.respectTransparency = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "GameTheory"
path = "GameTheory"

[[lean_lib]]
name = "Vegas"

[[lean_lib]]
name = "VegasTests"

[[lean_lib]]
name = "VegasEVM"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Interaction"

[[lean_lib]]
name = "InteractionTests"
